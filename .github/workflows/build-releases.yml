name: Build Multi-Platform Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: |
          cd android
          if [ -f gradlew ]; then chmod +x gradlew; else gradle wrapper; chmod +x gradlew; fi

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnimaxDL-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd desktop
          npm install

      - name: Package Windows Installer
        run: |
          cd desktop
          npm run pack:win || true

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnimaxDL-Windows-Installer
          path: desktop/dist/*.*
          if-no-files-found: ignore
