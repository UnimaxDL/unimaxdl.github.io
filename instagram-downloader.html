<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Instagram Video Downloader — Reels, Stories & Posts in HD | UnimaxDL</title>
  <meta name="description" content="Download Instagram Reels, Stories, IGTV and post videos in 1080p Full HD MP4. Free, fast, private, and 100% ad-free with UnimaxDL." />
  <meta name="keywords" content="instagram video downloader, instagram reels saver, download instagram stories, instagram to mp4, ig reel download free" />
  <link rel="canonical" href="https://unimaxdl.github.io/instagram-downloader.html" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #07070a;
      background-image: 
        radial-gradient(at 0% 0%, rgba(217, 70, 239, 0.14) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(249, 115, 22, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 15, 21, 0.9) 0px, #07070a 100%);
      background-attachment: fixed;
    }
    .glass-card {
      background: rgba(22, 22, 32, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body class="text-gray-100 font-sans antialiased selection:bg-fuchsia-500/30 selection:text-fuchsia-300">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-[#07070a]/80 backdrop-blur-xl border-b border-white/[0.08]">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-fuchsia-500 to-amber-500 flex items-center justify-center text-white font-black text-xl shadow-lg">
          📸
        </div>
        <span class="font-black text-lg text-white">Unimax<span class="text-fuchsia-400">DL</span></span>
      </a>

      <div class="flex items-center gap-4">
        <div id="udl-server-status"></div>
        <nav class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-300">
          <a href="/" class="hover:text-fuchsia-400 transition">All Tools</a>
          <a href="/youtube-downloader.html" class="hover:text-fuchsia-400 transition">YouTube</a>
          <a href="/tiktok-downloader.html" class="hover:text-fuchsia-400 transition">TikTok</a>
          <a href="/instagram-downloader.html" class="text-fuchsia-400 font-bold">Instagram</a>
          <a href="/download.html" class="hover:text-fuchsia-400 transition">Download App</a>
        </nav>
        <button onclick="UDL_DOWNLOADER.showSettingsModal()" class="p-2 rounded-xl glass-card text-gray-400 hover:text-white transition" title="Server Settings">
          ⚙️
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="pt-14 pb-10 px-4 text-center">
    <div class="max-w-3xl mx-auto space-y-4">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-fuchsia-500/10 border border-fuchsia-500/25 text-fuchsia-400 text-xs font-bold">
        <span>📸 Reels · Stories · Feed Posts · IGTV</span>
      </div>
      <h1 class="text-3xl sm:text-5xl font-black text-white tracking-tight">
        Instagram Video & Reels Downloader
      </h1>
      <p class="text-gray-400 text-sm sm:text-base max-w-xl mx-auto">
        Save public Instagram Reels, videos, and stories in high-definition MP4 directly to your device.
      </p>
    </div>
  </section>

  <!-- Downloader Widget -->
  <section class="max-w-3xl mx-auto px-4 pb-16">
    <div class="glass-card rounded-3xl p-6 sm:p-8 space-y-5">
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs">
          <label for="url-input" class="font-bold text-gray-300 uppercase tracking-wider">Paste Instagram Link (Reel, Post, Story)</label>
          <button onclick="pasteClipboard()" class="text-fuchsia-400 hover:text-fuchsia-300 font-bold flex items-center gap-1 text-[11px] transition">
            <span>📋</span> Paste
          </button>
        </div>
        <div class="relative flex items-center rounded-2xl border border-white/10 bg-[#0c0c12]">
          <span class="pl-4 text-gray-500">📸</span>
          <input 
            type="url" 
            id="url-input" 
            placeholder="https://www.instagram.com/reel/... or https://www.instagram.com/p/..." 
            class="w-full bg-transparent py-4 pl-3 pr-28 text-sm text-white placeholder-gray-500 focus:outline-none"
          />
          <button 
            id="analyze-btn" 
            onclick="handleAnalyze()" 
            class="mr-2 px-5 py-2.5 rounded-xl bg-gradient-to-r from-fuchsia-500 to-amber-500 hover:brightness-110 text-white font-black text-xs shadow-md transition flex-shrink-0">
            <span id="btn-text">Analyze</span>
          </button>
        </div>
      </div>

      <div id="media-card-container"></div>
      <div id="tasks-container"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="border-t border-white/[0.08] bg-[#050508] py-8 text-center text-xs text-gray-500">
    <p>UnimaxDL · Clean Instagram Reels Downloader</p>
  </footer>

  <script src="/assets/js/analytics.js"></script>
  <script src="/assets/js/downloader.js"></script>
  <script>
    async function pasteClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById('url-input').value = text;
          handleAnalyze();
        }
      } catch {}
    }

    async function handleAnalyze() {
      const url = document.getElementById('url-input').value.trim();
      const mediaContainer = document.getElementById('media-card-container');
      const btnText = document.getElementById('btn-text');
      if (!url) {
        UDL_DOWNLOADER.showToast("Please enter an Instagram video URL");
        return;
      }
      btnText.innerText = "Analyzing...";
      try {
        const info = await UDL_DOWNLOADER.analyzeUrl(url);
        if (info) {
          UDL_DOWNLOADER.renderMediaCard(info, mediaContainer);
          mediaContainer.scrollIntoView({ behavior: 'smooth' });
        }
      } catch (err) {
        UDL_DOWNLOADER.showToast(err.message || "Failed to analyze Instagram link.");
      } finally {
        btnText.innerText = "Analyze";
      }
    }

    UDL_DOWNLOADER.startPolling((tasks) => {
      UDL_DOWNLOADER.renderTasks(tasks, document.getElementById('tasks-container'));
    });
  </script>
</body>
</html>
